repos:
  # formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        files: ^(src/pynxtools_apm|tests|examples|examples/deu_berlin_kuehbach)/.*\.{py|ipynb}$
      - id: ruff-format
        files: ^(src/pynxtools_apm|tests|examples|examples/deu_berlin_kuehbach)/.*\.{py|ipynb}$

  # static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy

  # modernizes syntax for Python 3.11+
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  # removes notebook outputs before committing
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # spellchecking
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.3.0
    hooks:
      - id: cspell
        pass_filenames: false
        args:
          - --config
          - cspell.json
          - README.md
          - CITATION.cff
          - docs/**/*
          - src/pynxtools_apm/**/*.py
          - tests/**/*.py
