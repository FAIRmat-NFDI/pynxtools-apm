repos:
  # formatting and linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        files: ^(src/pynxtools_apm|tests|examples|examples/oasisb)/.*\.{py|ipynb}$
      - id: ruff-format
        files: ^(src/pynxtools_apm|tests|examples|examples/oasisb)/.*\.{py|ipynb}$

  # static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy

  # modernizes syntax for Python 3.11+
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  # removes notebook outputs before committing
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

